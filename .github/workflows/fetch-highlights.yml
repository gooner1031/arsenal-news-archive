name: fetch-highlights
on:
  schedule:
    - cron: '23 */3 * * *'
    # CLの試合後（火・水の夜〜翌朝 UTC）は、WOWOW公式の新着15本から流れる前に拾えるよう20分おきに軽い取得だけ行う
    - cron: '*/20 21-23 * * 2,3'
    - cron: '*/20 0-8 * * 3,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-highlights
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_highlights.py
        if: github.event_name != 'schedule' || github.event.schedule == '23 */3 * * *'
      - run: python3 tools/fetch_highlights_jp.py
      - name: Commit
        run: |
          git config user.name "arsenal-archive-bot"
          git config user.email "gooner1031@users.noreply.github.com"
          git add highlights.json
          git diff --cached --quiet || (git commit -m "公式ハイライト動画を自動取得" && git pull --rebase -q && git push)
