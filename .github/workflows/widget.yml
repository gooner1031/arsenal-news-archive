name: widget-data
# 日程（season.json）が main に入ったら、次の試合ウィジェット用のデータ（next.json）とカレンダー購読ファイル（fixtures.ics / fixtures-en.ics）を作り直す
on:
  push:
    branches: [main]
    paths:
      - 'season.json'
      - 'index.html'
      - 'tools/widget_data.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/widget_data.py
      - name: Commit
        run: |
          git config user.name "arsenal-archive-bot"
          git config user.email "gooner1031@users.noreply.github.com"
          git add next.json fixtures.ics fixtures-en.ics
          git diff --cached --quiet && exit 0
          git commit -m "次の試合ウィジェット・カレンダー用の日程データを自動更新"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
