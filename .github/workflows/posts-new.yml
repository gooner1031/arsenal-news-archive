name: posts-new
# posts.json が main に入ったら、ホームの初期表示用の posts-new.json（直近60日分）を作り直す
on:
  push:
    branches: [main]
    paths:
      - 'posts.json'
      - 'tools/split_posts.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posts-new
  cancel-in-progress: false
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/split_posts.py
      - name: Commit
        run: |
          git config user.name "arsenal-archive-bot"
          git config user.email "gooner1031@users.noreply.github.com"
          git add posts-new.json
          git diff --cached --quiet && exit 0
          git commit -m "ホーム用の直近ポスト（posts-new.json）を自動更新"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
