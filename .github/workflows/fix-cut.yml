name: fix-cut-posts
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-x
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full text of cut posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 tools/fix_cut.py
      - name: ホーム用の直近ポストも作り直す
        run: python3 tools/split_posts.py
      - name: Commit
        run: |
          git config user.name "arsenal-archive-bot"
          git config user.email "gooner1031@users.noreply.github.com"
          git add posts.json posts-old.json posts-new.json
          git diff --cached --quiet || (git commit -m "途切れた長文ポストを全文に復元" && git pull --rebase -q && git push)
