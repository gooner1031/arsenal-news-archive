name: league
# プレミアリーグ全クラブの試合（結果・日程）と得点・アシストランキングを取り込む（tools/league.py）。
# 30分ごとに FPL の公開データを確認し、中身が変わったときだけ league.json を main に入れる。
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: league
  cancel-in-progress: false
jobs:
  league:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/league.py
      - name: Commit
        run: |
          git config user.name "arsenal-archive-bot"
          git config user.email "gooner1031@users.noreply.github.com"
          git add league.json
          git diff --cached --quiet && exit 0
          git commit -m "プレミアリーグの全試合・得点ランキングを自動更新"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
