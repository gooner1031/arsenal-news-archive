name: league
# プレミアリーグ（tools/league.py・FPL）とチャンピオンズリーグ（tools/cl_stats.py・ESPN）の全試合と、選手・チームのスタッツを取り込む。
# 30分ごとに公開データを確認し、中身が変わったときだけ league.json / cl.json を main に入れる。片方が取れなくても、もう片方は入れる。
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: league
  cancel-in-progress: false
jobs:
  league:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Premier League
        id: pl
        continue-on-error: true
        run: python3 tools/league.py
      - name: Champions League
        id: cl
        continue-on-error: true
        run: python3 tools/cl_stats.py
      - name: Commit
        run: |
          git config user.name "arsenal-archive-bot"
          git config user.email "gooner1031@users.noreply.github.com"
          git add league.json cl.json tools/cl_days.json tools/pl_days.json
          git diff --cached --quiet && exit 0
          git commit -m "プレミアリーグ・CLの全試合とスタッツを自動更新"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
      - name: Report failures
        if: steps.pl.outcome == 'failure' || steps.cl.outcome == 'failure'
        run: |
          echo "PL: ${{ steps.pl.outcome }} / CL: ${{ steps.cl.outcome }}"
          exit 1
