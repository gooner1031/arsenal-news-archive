<script>
/* 共有ページ（s/<名前>.html）がまだ作られていないとき（追加直後など）も、サイトの該当ページへ移す */
(function(){var p=location.pathname,i=p.indexOf('/s/'),root=i>=0?p.slice(0,i+1):(/^\/arsenal-news-archive\//.test(p)?'/arsenal-news-archive/':'/');
var m=i>=0&&p.slice(i+3).match(/^((?:tr-\d+-\d{4}[SW])|(?:match-[a-z0-9]+?)|(?:person-\d+))(?:-ns)?(?:\.html)?$/);
location.replace(root+(m?'#'+m[1]:''));})();
</script>
