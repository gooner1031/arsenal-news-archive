apply();if(m&&pref==='auto'){if(m.addEventListener)m.addEventListener('change',apply);else if(m.addListener)m.addListener(apply);}
d.setAttribute('data-fz',f);d.lang=L;if(/[?&]embed\b/.test(q))d.setAttribute('data-embed','1');})();</script>
<style>

.nm .v{font-size:calc(12px*var(--fz));font-weight:900;opacity:.75}

<body>
<div class="wrap">
  <div class="top"><span>ARSENAL NEWS ARCHIVE</span><a href="./#calendar" id="siteLink">サイトを開く ›</a></div>
  <div id="main"><div class="err" id="loading">読み込み中…</div></div>

</div>
<div class="toast" id="toast"></div>
<script>
(function(){
const EN=document.documentElement.lang==='en';
const SITE='https://gooner1031.github.io/arsenal-news-archive/';
const ICS=SITE.replace(/^https:/,'webcal:')+(EN?'fixtures-en.ics':'fixtures.ics');
const WDJ=['日','月','火','水','木','金','土'], WDE=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const T=EN?{next:'NEXT MATCH',home:'Home · Emirates Stadium',away:'Away',jst:'Japan time (JST)',uk:'UK time',you:'Your time',tbc:'Kick-off time TBC',
  in:'in ',d:'d ',h:'h ',m:'m',live:'Kicked off',after:'Coming up',none:'No upcoming fixtures yet.',err:'Could not load fixtures. Please check your connection.',open:'Open the site ›',
  asof:'Fixtures as of ',me:'Arsenal'}
 :{next:'NEXT MATCH',home:'ホーム · エミレーツ・スタジアム',away:'アウェイ',jst:'日本時間',uk:'イギリス時間',you:'お使いの端末の時間',tbc:'キックオフ時間は未定',
  in:'キックオフまで ',d:'日 ',h:'時間 ',m:'分',live:'キックオフ済み',after:'この後の試合',none:'今後の日程はまだありません。',err:'日程を読み込めませんでした。通信状況を確認してください。',open:'サイトを開く ›',
  asof:'日程は ',me:'アーセナル'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('siteLink').textContent=T.open;
// 日時の表示：タイムゾーンのずれ（分）を足して UTC として読む（端末の設定に左右されない）
function fmt(ms,offMin,withWd){ const d=new Date(ms+offMin*60e3), mo=d.getUTCMonth()+1, da=d.getUTCDate(), w=d.getUTCDay();
  const hm=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  return EN?(withWd!==false?WDE[w]+' ':'')+da+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo-1]+' '+hm
           :mo+'/'+da+(withWd!==false?'('+WDJ[w]+')':'')+' '+hm; }
function dOnly(s){ const [y,m,d]=s.split('-').map(Number), w=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  return EN?WDE[w]+' '+d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]:m+'/'+d+'('+WDJ[w]+')'; }
// イギリス時間のずれ（夏時間：3月最終日曜 1:00 UTC 〜 10月最終日曜 1:00 UTC は +60分）
function ukOff(ms){ const y=new Date(ms).getUTCFullYear(); const lastSun=(mo)=>{ const d=new Date(Date.UTC(y,mo+1,0)); return Date.UTC(y,mo,d.getUTCDate()-d.getUTCDay(),1); };
  return ms>=lastSun(2)&&ms<lastSun(9)?60:0; }
const oName=m=>EN?m.o_en:m.o, cTag=m=>'<i class="tag '+(m.cs==='CL'?'cl':m.cs==='PL'?'pl':'')+'">'+esc(EN?m.cs_en:m.cs)+'</i>';
let DATA=null, timer=null;
function upcoming(){ const now=Date.now();
  return DATA.matches.filter(m=>m.ko?Date.parse(m.ko)+2*3600e3>now:Date.parse(m.d+'T23:59:59Z')>now); }
function render(){
  const ms=upcoming(), main=$('main');
  if(!ms.length){ main.innerHTML='<div class="err">'+T.none+'</div>'; return; }
  const n=ms[0], me='<span class="tm me">'+T.me+'</span>', op='<span class="tm">'+esc(oName(n))+'</span>';
  let ko='';
  if(n.ko){ const t=Date.parse(n.ko), you=-new Date(t).getTimezoneOffset();
    ko='<div class="ko"><b>'+fmt(t,540)+'</b><span>'+T.jst+'</span></div>';
    const alts=['<span>'+T.uk+' '+fmt(t,ukOff(t))+'</span>'];
    if(you!==540&&you!==ukOff(t)) alts.unshift('<span>'+T.you+' '+fmt(t,you)+'</span>');
    ko+='<div class="alt">'+alts.join('<br>')+'</div><div class="cd" id="cd"></div>'; }
  else ko='<div class="ko"><b>'+dOnly(n.d)+'</b><span>'+T.tbc+'</span></div>';
  let h='<a class="nm" href="'+SITE+'#matchinfo" target="_top"><div class="lbl">'+T.next+'<i>'+esc(EN?n.c_en:n.c)+'</i></div>'+
    '<div class="vs">'+(n.ha==='H'?me+'<span class="v">VS</span>'+op:op+'<span class="v">VS</span>'+me)+'</div>'+
    '<div class="ha">'+(n.ha==='H'?T.home:T.away)+'</div>'+ko+'</a>';
  const rest=ms.slice(1,5);
  if(rest.length) h+='<div class="sec">'+T.after.toUpperCase()+'</div><div class="list">'+rest.map(m=>{
    const t=m.ko?Date.parse(m.ko):0;
    return '<div class="row"><span class="dt">'+(m.ko?fmt(t,540).replace(/ (\d\d:\d\d)$/,'<small>$1 JST</small>'):dOnly(m.d)+'<small>'+(EN?'TBC':'時間未定')+'</small>')+'</span>'+
      '<span class="o">'+(m.ha==='H'?'vs ':'@ ')+esc(oName(m))+'<small>'+(m.ha==='H'?(EN?'Home':'ホーム'):(EN?'Away':'アウェイ'))+'</small></span>'+cTag(m)+'</div>'; }).join('')+'</div>';
  main.innerHTML=h; tick();
}
function tick(){ const el=$('cd'); if(!el||!DATA) return; const ms=upcoming(); if(!ms.length||!ms[0].ko) return;
  const s=Math.floor((Date.parse(ms[0].ko)-Date.now())/1000);
  if(s<=0){ el.innerHTML='<em>'+T.live+'</em>'; return; }
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  el.innerHTML='<em>'+T.in+(d?d+T.d:'')+(d||h?h+T.h:'')+m+T.m+'</em>'; }
function load(){ return fetch('next.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(j=>{ DATA=j; render(); $('note').textContent=EN?T.asof+j.asof+' · kick-off times may change':T.asof+j.asof.replace(/-/g,'/')+' 時点・キックオフ時間は変更になることがあります'; })
  .catch(()=>{ if(!DATA) $('main').innerHTML='<div class="err">'+T.err+'</div>'; }); }
load();
clearInterval(timer); timer=setInterval(()=>{ if(!DATA) return; const ms=upcoming(); if(ms.length&&ms[0].ko&&Date.parse(ms[0].ko)+2*3600e3<Date.now()) render(); else tick(); },20000);
// 開きっぱなし（ホーム画面から開いたまま）でも、戻ってきたときに最新の日程を取り直す
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') load(); });

// ---- 設定のしかた（ホーム画面・カレンダー・iPhone ウィジェット） ----
const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const gcal='https://calendar.google.com/calendar/r?cid='+ICS;
const SCR=SITE+'widget-scriptable.js';
const S=EN?
 '<div class="sec">USE IT ON YOUR PHONE</div>'+
 '<div class="box"><h3>📅 Add fixtures to your calendar</h3><p>Subscribe once and every upcoming match appears in your phone’s calendar app and calendar widget. Kick-off time changes are picked up automatically (no scores).</p>'+
 '<div class="btns"><a class="btn" href="'+ICS+'">iPhone / Mac<small>Apple Calendar</small></a><a class="btn" href="'+gcal+'" target="_blank" rel="noopener">Android / PC<small>Google Calendar</small></a></div>'+
 '<div class="btns" style="margin-top:8px"><button class="btn sub" type="button" data-copy="'+ICS.replace(/^webcal:/,'https:')+'">Copy calendar URL<small>for other calendar apps</small></button></div></div>'+
 '<div class="box"><h3>📲 Add this page to your home screen</h3><p>Opens straight to the next match with one tap.</p><ol>'+(ios?'<li>Tap the Share button □↑ in Safari</li><li>Choose “Add to Home Screen”</li>':'<li>Open the browser menu (︙)</li><li>Choose “Add to Home screen” or “Install app”</li>')+'</ol></div>'+
 '<details class="box"><summary>🧩 iPhone home-screen widget (Scriptable)</summary><p style="margin-top:8px">Shows the next opponent and kick-off time right on your home or lock screen, using the free app “Scriptable”.</p><ol>'+
 '<li>Install <a href="https://apps.apple.com/app/scriptable/id1405459188" target="_blank" rel="noopener">Scriptable</a> (free) from the App Store</li><li>Tap “Copy script” below, open Scriptable, tap ＋ and paste</li><li>Long-press the home screen → ＋ → Scriptable → add a small or medium widget</li><li>Long-press the widget → Edit Widget → choose the script. Type <code>en</code> in “Parameter” for English</li></ol>'+
 '<p style="margin:8px 0 0"><b>Transparent background (optional)</b>: iPhone widgets can’t be truly transparent, so the script cuts your wallpaper to fit behind the widget.</p><ol>'+
 '<li>Long-press the home screen until the icons jiggle, go to the empty page on the far right and take a screenshot (one in Light mode and one in Dark mode if you use both)</li><li>Run the script inside Scriptable → “Set transparent background” → choose the screenshot, the widget size and its position</li><li>Type <code>clear</code> in “Parameter” (<code>en,clear</code> for English)</li></ol>'+
 '<p style="margin:6px 0 0;font-size:calc(11.5px*var(--fz))">Redo step 1–2 when you change your wallpaper. If the background doesn’t follow Light/Dark, add <code>light</code> or <code>dark</code> (e.g. <code>clear,dark</code>).</p>'+
 '<div class="btns"><button class="btn" type="button" id="cpScr">Copy script</button><a class="btn sub" href="'+SCR+'" target="_blank" rel="noopener">View script</a></div>'+
 '<p style="margin:10px 0 0;font-size:calc(11.5px*var(--fz))">Android: KWGT and similar widget apps can read <code>'+SITE+'next.json</code>.</p></details>'
:
 '<div class="sec">スマホで使う</div>'+
 '<div class="box"><h3>📅 カレンダーに試合日程を登録</h3><p>一度登録すると、スマホのカレンダーアプリとカレンダーのウィジェットに次の試合（相手・キックオフ時間）が出ます。日程や時間の変更も自動で反映されます（スコアは出ません）。</p>'+
 '<div class="btns"><a class="btn" href="'+ICS+'">iPhone・Mac<small>標準のカレンダーに登録</small></a><a class="btn" href="'+gcal+'" target="_blank" rel="noopener">Android・PC<small>Googleカレンダーに登録</small></a></div>'+
 '<div class="btns" style="margin-top:8px"><button class="btn sub" type="button" data-copy="'+ICS.replace(/^webcal:/,'https:')+'">カレンダーのURLをコピー<small>ほかのカレンダーアプリ用</small></button></div></div>'+
 '<div class="box"><h3>📲 このページをホーム画面に追加</h3><p>ワンタップで次の試合の画面が開きます。</p><ol>'+(ios?'<li>Safari の共有ボタン □↑ をタップ</li><li>「ホーム画面に追加」を選ぶ</li>':'<li>ブラウザのメニュー（︙）を開く</li><li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li>')+'</ol></div>'+
 '<details class="box"><summary>🧩 iPhoneのホーム画面ウィジェット（Scriptable）</summary><p style="margin-top:8px">無料アプリ「Scriptable」を使うと、ホーム画面やロック画面に次の対戦相手とキックオフ時間を常に表示できます。</p><ol>'+
 '<li>App Store で <a href="https://apps.apple.com/jp/app/scriptable/id1405459188" target="_blank" rel="noopener">Scriptable</a>（無料）を入れる</li><li>下の「スクリプトをコピー」→ Scriptable を開いて ＋ → 貼り付け</li><li>ホーム画面を長押し → ＋ → Scriptable → 小 または 中 のウィジェットを追加</li><li>ウィジェットを長押し →「ウィジェットを編集」→ Script で貼り付けたスクリプトを選ぶ（Parameter に <code>en</code> で英語表示）</li></ol>'+
 '<p style="margin:8px 0 0"><b>背景を透過にする（任意）</b>：iPhone のウィジェットは本当の透過ができないため、壁紙をウィジェットの位置に合わせて切り出して背景にします。</p><ol>'+
 '<li>ホーム画面を長押ししてアイコンが揺れている状態で、いちばん右の何もないページのスクショを撮る（ライトとダークを両方使うなら1枚ずつ）</li><li>Scriptable のアプリ内でスクリプトを実行 →「透過の背景を設定」→ スクショ・ウィジェットの大きさ・位置を選ぶ</li><li>ウィジェットの Parameter に <code>clear</code> と入れる（英語なら <code>en,clear</code>）</li></ol>'+
 '<p style="margin:6px 0 0;font-size:calc(11.5px*var(--fz))">壁紙を変えたら 1〜2 をやり直してください。ライト/ダークで背景が切り替わらないときは <code>light</code> か <code>dark</code> を足すと固定できます（例 <code>clear,dark</code>）。</p>'+
 '<div class="btns"><button class="btn" type="button" id="cpScr">スクリプトをコピー</button><a class="btn sub" href="'+SCR+'" target="_blank" rel="noopener">スクリプトを見る</a></div>'+
 '<p style="margin:10px 0 0;font-size:calc(11.5px*var(--fz))">Android：KWGT などのウィジェットアプリで <code>'+SITE+'next.json</code> を読み込めます。</p></details>';
$('setup').innerHTML=S;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800); }
function copy(t){ const done=()=>toast(EN?'Copied':'コピーしました');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>fallback(t)); else fallback(t);
  function fallback(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(e){} a.remove(); } }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-copy]'); if(b) copy(b.getAttribute('data-copy')); });
// iPhone の Safari はタップの直後でないとコピーできないので、スクリプトは先に読んでおく
let SCRT=''; fetch('widget-scriptable.js',{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{SCRT=t;}).catch(()=>{});
$('cpScr').addEventListener('click',()=>{ if(SCRT) copy(SCRT); else toast(EN?'Copy failed. Use “View script”.':'コピーできませんでした。「スクリプトを見る」から選んでコピーしてください'); });
})();
